<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="1520" height="672" role="img" aria-label="Agents wait at the gate; Collaborator goes straight to LM Studio" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="gate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#A3A39A"/>
    </marker>
  </defs>
  <rect width="760" height="336" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1F1E1D">Agents wait at the gate; Collaborator goes straight to LM Studio</text>

  <g>
    <rect x="296" y="60" width="440" height="252" rx="8" fill="#EDEDEA" stroke="#C9C8C0" stroke-width="1"/>
    <text x="312" y="86" font-weight="600" fill="#1F1E1D">Mac: M5 MacBook Pro, on the tailnet</text>
  </g>

  <g>
    <rect x="24" y="80" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#C9C8C0" stroke-width="1.25"/>
    <text x="40" y="104" font-weight="600" fill="#1F1E1D">pi coding agents</text>
    <text x="40" y="124" font-size="11.5" fill="#6B6A63">Up to 4, on Proxmox VMs</text>
    <text x="40" y="140" font-size="11.5" fill="#6B6A63">Base URL :8080/v1</text>
  </g>

  <g>
    <rect x="24" y="232" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#C9C8C0" stroke-width="1.25"/>
    <text x="40" y="256" font-weight="600" fill="#1F1E1D">Collaborator</text>
    <text x="40" y="276" font-size="11.5" fill="#6B6A63">Chat calls :1234 directly</text>
    <text x="40" y="292" font-size="11.5" fill="#6B6A63">Toggle calls /gate/*</text>
  </g>

  <g>
    <rect x="312" y="112" width="196" height="88" rx="8" fill="#D6E2EE" stroke="#2C7BE5" stroke-width="2"/>
    <text x="328" y="136" font-weight="600" fill="#1F1E1D">inference-gate :8080</text>
    <text x="328" y="156" font-size="11.5" fill="#1F1E1D">Holds POSTs while paused</text>
    <text x="328" y="172" font-size="11.5" fill="#1F1E1D">Releases FIFO on resume</text>
    <text x="328" y="188" font-size="11.5" fill="#1F1E1D">Control API: /gate/*</text>
  </g>

  <g>
    <rect x="540" y="112" width="180" height="72" rx="8" fill="#EDEDEA" stroke="#C9C8C0" stroke-width="1.25"/>
    <text x="556" y="136" font-weight="600" fill="#1F1E1D">LM Studio :1234</text>
    <text x="556" y="156" font-size="11.5" fill="#6B6A63">One local model</text>
    <text x="556" y="172" font-size="11.5" fill="#6B6A63">OpenAI-compatible API</text>
  </g>

  <g fill="none" stroke="#A3A39A" stroke-width="1.25">
    <path d="M240 130H312" marker-end="url(#gate-arrow)"/>
    <path d="M508 148H540" marker-end="url(#gate-arrow)"/>
    <path d="M240 244H360V200" stroke-dasharray="4 4" marker-end="url(#gate-arrow)"/>
    <path d="M240 288H630V184" marker-end="url(#gate-arrow)"/>
  </g>

  <text x="276" y="122" text-anchor="middle" font-size="11.5" fill="#6B6A63">requests</text>
  <text x="368" y="226" font-size="11.5" fill="#6B6A63">pause / resume / status</text>
  <text x="440" y="280" text-anchor="middle" font-size="11.5" fill="#6B6A63">chat, direct to :1234</text>
</svg>
